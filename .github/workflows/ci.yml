name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Deno 2.9.5
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Check and test
        run: deno task ci
