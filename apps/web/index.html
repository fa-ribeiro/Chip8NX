<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chip8NX Classic CHIP-8 web emulator" />

    <title>Chip8NX Web</title>
  </head>

  <body>
    <main class="app">
      <header>
        <h1>Chip8NX</h1>
        <p>Classic CHIP-8 web host</p>
      </header>

      <section class="rom-loader" aria-label="ROM loader">
        <label for="rom-input"> Choose ROM </label>

        <input id="rom-input" type="file" accept=".ch8,application/octet-stream" />

        <p id="status" role="status">Choose a CHIP-8 ROM to begin.</p>
      </section>

      <section class="controls" aria-label="Emulation controls">
        <button id="start-button" type="button" disabled>Start</button>

        <button id="pause-button" type="button" disabled>Pause</button>

        <button id="step-button" type="button" disabled>Step</button>

        <button id="reset-button" type="button" disabled>Reset</button>
      </section>

      <section class="display" aria-label="CHIP-8 display">
        <canvas
          id="chip8-display"
          width="64"
          height="32"
          aria-label="CHIP-8 framebuffer"
        ></canvas>
      </section>

      <section class="keypad" aria-label="Virtual CHIP-8 keypad">
        <h2>Keypad</h2>

        <div id="virtual-keypad" class="virtual-keypad">
          <button type="button" data-chip8-key="1" disabled>1</button>
          <button type="button" data-chip8-key="2" disabled>2</button>
          <button type="button" data-chip8-key="3" disabled>3</button>
          <button type="button" data-chip8-key="C" disabled>C</button>

          <button type="button" data-chip8-key="4" disabled>4</button>
          <button type="button" data-chip8-key="5" disabled>5</button>
          <button type="button" data-chip8-key="6" disabled>6</button>
          <button type="button" data-chip8-key="D" disabled>D</button>

          <button type="button" data-chip8-key="7" disabled>7</button>
          <button type="button" data-chip8-key="8" disabled>8</button>
          <button type="button" data-chip8-key="9" disabled>9</button>
          <button type="button" data-chip8-key="E" disabled>E</button>

          <button type="button" data-chip8-key="A" disabled>A</button>
          <button type="button" data-chip8-key="0" disabled>0</button>
          <button type="button" data-chip8-key="B" disabled>B</button>
          <button type="button" data-chip8-key="F" disabled>F</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
